<section class="py-section-gap px-gutter max-w-container-max mx-auto" id="projects">
  <div class="text-center mb-16">
    <h2 class="font-headline-lg text-3xl md:text-headline-lg text-on-surface">{{ langService.t().projects.title }}</h2>
    <p class="text-on-surface-variant font-body-md mt-2">{{ langService.t().projects.desc }}</p>
  </div>
  <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
    @for (proj of projects(); track proj.title) {
      <div appThreeDTilt appScrollReveal [revealDelay]="$index * 100"
           [class]="proj.borderClass ? 'glass-card group rounded-3xl overflow-hidden ' + proj.borderClass : 'glass-card group rounded-3xl overflow-hidden'">
        <div class="aspect-video relative overflow-hidden bg-surface-container cursor-pointer" (click)="openModal(proj)">
          <div class="absolute inset-0 bg-gradient-to-t from-surface to-transparent opacity-60"></div>
          <div class="w-full h-full bg-cover bg-center group-hover:scale-110 transition-transform duration-500"
               [style.background-image]="'url(' + proj.imageUrl + ')'"></div>
          <div class="absolute top-4 left-4 px-3 py-1 rounded-lg text-xs font-bold app-parallax"
               [class]="proj.categoryClass">{{ proj.category }}</div>
        </div>
        <div class="p-8 app-parallax">
          <h3 class="font-headline-md text-xl md:text-headline-md text-on-surface mb-2 cursor-pointer hover:text-primary transition-colors" (click)="openModal(proj)">{{ proj.title }}</h3>
          <p class="text-on-surface-variant font-body-md mb-6 h-12 line-clamp-2">{{ proj.description }}</p>
          <div class="flex justify-between items-center pt-2">
            <div class="flex gap-2">
              @for (icon of proj.icons; track icon) {
                <span class="material-symbols-outlined text-primary text-xl"
                      [style.font-variation-settings]="icon === 'psychology' ? '\'FILL\' 1' : null">{{ icon }}</span>
              }
            </div>
            <div class="flex items-center gap-2">
              <button (click)="openModal(proj)" (mouseenter)="audioService.playHover()" class="text-primary font-bold text-xs sm:text-sm flex items-center gap-1 hover:translate-x-0.5 transition-transform cursor-pointer px-3 py-1.5 rounded-lg bg-primary/10 hover:bg-primary/20 border border-primary/30">
                {{ langService.t().projects.detailsBtn }} <span class="material-symbols-outlined text-sm">open_in_new</span>
              </button>
            </div>
          </div>
        </div>
      </div>
    }
  </div>

  <app-project-modal [project]="selectedProject" (close)="closeModal()"></app-project-modal>
</section>
