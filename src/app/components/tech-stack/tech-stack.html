<section class="py-section-gap px-gutter max-w-container-max mx-auto" id="tech">
  <div class="flex flex-col md:flex-row justify-between items-end mb-stack-lg gap-4">
    <div>
      <h2 class="font-headline-lg text-3xl md:text-headline-lg text-on-surface">{{ langService.t().tech.title }}</h2>
      <p class="text-on-surface-variant font-body-md mt-2">{{ langService.t().tech.desc }}</p>
    </div>
    <div class="h-[1px] flex-grow bg-gradient-to-r from-primary/30 to-transparent ml-8 hidden md:block"></div>
  </div>
  <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-6">
    @for (cat of categories; track cat.title; let idx = $index) {
      <div appThreeDTilt appScrollSpin
           [class]="(cat.isFeatured ? 'tech-card featured-card' : 'tech-card') + (idx === 4 ? ' sm:max-lg:col-span-2' : '')">
        <div class="flex items-center gap-3 mb-5 border-b border-black/10 dark:border-white/10 pb-3 app-parallax">
          <div class="w-10 h-10 rounded-xl bg-primary/10 border border-primary/20 flex items-center justify-center text-primary shadow-[0_0_15px_rgba(0,245,212,0.15)]">
            <span class="material-symbols-outlined text-2xl" style="font-variation-settings: 'FILL' 1;">{{ cat.icon }}</span>
          </div>
          <h3 class="font-headline-md text-[19px] font-bold text-on-surface tracking-tight">{{ cat.title }}</h3>
        </div>
        <ul class="space-y-3.5 font-code-sm app-parallax">
          @for (skill of cat.skills; track skill.name) {
            <li class="flex items-center gap-3 group/item">
              <div class="w-8 h-8 rounded-lg bg-black/5 dark:bg-white/5 border border-black/10 dark:border-white/5 flex items-center justify-center group-hover/item:border-primary/40 group-hover/item:bg-primary/10 transition-all duration-300">
                <i [class]="skill.icon + ' text-base transition-transform group-hover/item:scale-110 duration-300 text-on-surface'"></i>
              </div>
              <span class="text-on-surface-variant group-hover/item:text-primary font-medium transition-colors">{{ skill.name }}</span>
            </li>
          }
        </ul>
      </div>
    }
  </div>
</section>
