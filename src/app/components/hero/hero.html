<section class="relative min-h-screen flex flex-col items-center justify-center pt-32 pb-section-gap px-gutter text-center overflow-hidden">
  <div class="max-w-4xl mx-auto space-y-stack-lg">
    <header class="space-y-stack-sm">
      <p class="font-code-sm text-code-sm text-primary tracking-[0.3em] uppercase opacity-80">
        {{ langService.t().hero.subtitle }}
      </p>
      <h1 class="font-headline-xl text-headline-xl text-on-surface transition-colors duration-400">
        {{ langService.t().hero.title }}<br/>
        <span class="text-primary-container glow-cyan">{{ langService.t().hero.titleGlow }}</span>
      </h1>
    </header>
    <p class="font-body-lg text-body-lg text-on-surface-variant max-w-2xl mx-auto">
      {{ langService.t().hero.desc }}
    </p>
    
    <!-- 3D WebGL Canvas Interactive Core -->
    <div class="relative py-6 group w-full max-w-[500px] mx-auto overflow-visible">
      <div class="absolute inset-0 bg-primary/10 blur-[120px] rounded-full scale-90 animate-pulse-slow pointer-events-none"></div>
      <app-three-d class="block relative w-full h-full glow-cyan"></app-three-d>
    </div>

    <div class="flex flex-col sm:flex-row items-center justify-center gap-stack-md pt-8">
      <a class="w-full sm:w-auto px-10 py-4 bg-primary text-on-primary font-bold rounded-xl hover:shadow-[0_0_30px_rgba(0,245,212,0.5)] transition-all flex items-center justify-center gap-2" href="#projects">
        {{ langService.t().hero.btnProjects }}
        <span class="material-symbols-outlined text-base">arrow_forward</span>
      </a>
      <a class="w-full sm:w-auto px-10 py-4 border border-primary/40 text-primary font-bold rounded-xl hover:bg-primary/10 transition-all flex items-center justify-center gap-2" href="#contact">
        {{ langService.t().hero.btnHire }}
        <span class="material-symbols-outlined text-base">mail</span>
      </a>
    </div>
  </div>
</section>
