<section class="py-section-gap px-gutter max-w-container-max mx-auto" id="terminal">
  <div class="glass-card rounded-3xl overflow-hidden border border-primary/30 shadow-[0_0_50px_rgba(0,245,212,0.1)]">
    <!-- Terminal Header Bar -->
    <div class="bg-[#090b0f] px-6 py-3 border-b border-white/10 flex items-center justify-between">
      <div class="flex items-center gap-2">
        <div class="w-3 h-3 rounded-full bg-[#ff5f56]"></div>
        <div class="w-3 h-3 rounded-full bg-[#ffbd2e]"></div>
        <div class="w-3 h-3 rounded-full bg-[#27c93f]"></div>
        <span class="font-code-sm text-xs text-on-surface-variant/60 ml-2 font-mono select-none">macs-cli v4.2 -- zsh</span>
      </div>
      <div class="flex items-center gap-2">
        <span class="inline-block w-2 h-2 rounded-full bg-primary animate-ping"></span>
        <span class="font-code-sm text-xs text-primary font-bold tracking-wider uppercase">ONLINE</span>
      </div>
    </div>

    <!-- Quick Action Chips -->
    <div class="bg-[#0d1017] px-6 py-2.5 border-b border-white/5 flex items-center gap-2 overflow-x-auto">
      <span class="text-xs text-on-surface-variant font-mono mr-1 hidden sm:inline">Ejecutar:</span>
      @for (chip of quickCommands; track chip) {
        <button (click)="runCommand(chip)"
                class="px-3 py-1 bg-white/5 hover:bg-primary/20 text-primary border border-primary/30 rounded-lg text-xs font-mono transition-all hover:scale-105 whitespace-nowrap">
          ${{ chip }}
        </button>
      }
    </div>

    <!-- Terminal Console Body -->
    <div #terminalContainer (click)="focusInput()"
         [class.matrix-glow]="isMatrixMode"
         class="bg-[#0c0e12]/95 p-6 h-80 overflow-y-auto font-mono text-sm space-y-4 cursor-text font-code-sm">
      @for (item of history; track $index) {
        <div class="space-y-1">
          <div class="flex items-center gap-2 text-primary font-bold">
            <span class="text-secondary">macs@cyber-core:~$</span>
            <span>{{ item.command }}</span>
          </div>
          <div [class.text-error]="item.isError" [class.text-[#00ff66]]="isMatrixMode" class="text-on-surface-variant whitespace-pre-wrap pl-4 border-l-2 border-primary/20">
            {{ item.response }}
          </div>
        </div>
      }

      <!-- Active Input Prompt Line -->
      <div class="flex items-center gap-2 text-primary">
        <span class="text-secondary font-bold">macs@cyber-core:~$</span>
        <input #cmdInput [(ngModel)]="inputCommand" (keyup.enter)="runCommand()"
               type="text"
               class="flex-grow bg-transparent outline-none border-none text-on-surface font-mono text-sm caret-primary"
               placeholder="Escribe 'help'..." autofocus/>
      </div>
    </div>
  </div>
</section>
