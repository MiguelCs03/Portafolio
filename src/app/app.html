@if (showPreloader) {
  <div class="fixed inset-0 bg-[#0c0e12] z-[9999] flex items-center justify-center transition-all duration-700 pointer-events-auto"
       [class.opacity-0]="!isLoading" [class.pointer-events-none]="!isLoading">
    <div class="text-center space-y-4 transition-all duration-500 scale-95"
         [class.opacity-0]="!isLoading" [class.scale-75]="!isLoading">
      <!-- Glow Logo Text -->
      <h1 class="font-headline-xl text-5xl md:text-7xl font-bold tracking-[0.2em] text-white select-none filter drop-shadow-[0_0_20px_rgba(0,245,212,0.4)] animate-pulse">
        M. CESARY
      </h1>
      <!-- Decorative futuristic neon line -->
      <div class="h-[2px] w-24 bg-gradient-to-r from-transparent via-primary-container to-transparent mx-auto rounded-full shadow-[0_0_8px_rgba(0,245,212,0.8)]"></div>
    </div>
  </div>
}

<app-header></app-header>
<main class="relative">
  <!-- BACKGROUND ATMOSPHERE -->
  <div class="fixed inset-0 pointer-events-none neural-bg -z-10"></div>
  <app-neural-bg></app-neural-bg>

  <app-hero></app-hero>
  <app-tech-stack></app-tech-stack>
  <app-experience></app-experience>
  <app-projects></app-projects>
  <app-contact></app-contact>
  <app-footer></app-footer>
</main>
